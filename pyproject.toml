[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rmgpu"
version = "0.1.0"
description = "Reaction Mechanism Generator (GPU implementation)"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "torchdae",
    "chemprop",
    "cantera",
    "chemicals",
    "fluids",
    "thermo",
    "pint",
    "sqlalchemy",
    "pydantic",
    "rdkit",
    "click",
]

[project.scripts]
rmgpu = "rmgpu.cli:main"
rmgpu-version = "rmgpu.version:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rmgpu*"]
exclude = ["tests*", "gates*"]
